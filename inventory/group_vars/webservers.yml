---
# Basispakketten op Debian 12
common_packages:
  - curl
  - git
  - vim
  - tmux
  - ca-certificates

# --- webserver ---
web_server_name: "eliyah-web01"
web_root: "/var/www/eliyah-web"
web_domain: "eliyah-web.local"

# nginx + PHP-FPM (Debian 12 levert PHP 8.2)
php_version: "8.2"
web_packages:
  - nginx
  - php-fpm
  - php-cli
  - php-mysql

# --- database-aansluiting (db_* staat in group_vars/all.yml) ---
web_db_host: "192.168.56.12"
