# Inventaris van het Ansible-lab van Eliyah Impelmans.
# Alle machines draaien in een host-only netwerk (192.168.56.0/24) van VirtualBox.

[webservers]
eliyah-web01 ansible_host=192.168.56.11

[dbservers]
eliyah-db01 ansible_host=192.168.56.12

[servers:children]
webservers
dbservers

[servers:vars]
ansible_user=eliyah
ansible_python_interpreter=/usr/bin/python3
